packages:
  - apps/*
  - packages/*
# The loops.company toolkit is our own first-party scope, so the supply-chain
# minimum-release-age guard doesn't apply — allow freshly-published versions.
minimumReleaseAgeExclude:
  - "@chiemerieokorie/trigger-kit"
  - "@chiemerieokorie/docling"
allowBuilds:
  esbuild: true
  msw: true
  msgpackr-extract: true
  sharp: true
  lefthook: true
catalog:
  dotenv: ^17.2.2
  zod: ^4.1.13
  typescript: ^6
  lucide-react: ^0.546.0
  next-themes: ^0.4.6
  sonner: ^2.0.5
  convex: ^1.33.1
  better-auth: ~1.6.9
  "@convex-dev/better-auth": ^0.12.2
  "@tanstack/react-form": ^1.28.0
  "@types/react-dom": ^19.2.3
  "@better-auth/expo": ~1.6.9
